name: Data Preprocessing Pipeline CI

on:
  push:
    branches:
      - main
    paths:
      - 'main.py'
      - '.github/workflows/preprocess.yml'
      - 'dataset/raw/**/*.csv'
      - 'dataset/raw/**/*.xlsx'
      - 'preprocessing/**'
  pull_request:
    branches:
      - main
    paths:
      - 'main.py'
      - '.github/workflows/preprocess.yml'
      - 'dataset/raw/**/*.csv'
      - 'dataset/raw/**/*.xlsx'
      - 'preprocessing/**'

jobs:
  check-code-quality:
    name: Lint, Format, and Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Check code formatting with Black
        run: uv run black --check main.py preprocessing/

      - name: Lint with Flake8
        run: uv run flake8 main.py preprocessing/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Type check with MyPy
        run: uv run mypy main.py preprocessing/

  run-preprocessing:
    name: Run Preprocessing Pipeline
    needs: check-code-quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run pipeline
        run: |
          uv run python main.py preprocess dataset/raw/PCOS_infertility.csv dataset/raw/PCOS_data_without_infertility.xlsx -o dataset/processed/ci_test_output.csv

      - name: Clean up test output
        if: always()
        run: rm -f dataset/processed/ci_test_output.csv