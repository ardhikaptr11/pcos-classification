name: Data Preprocessing Pipeline CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'config/'
      - 'handlers/train.py'
      - 'parsers/train.py'
      - 'utils/'
      - 'training/'
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'config/'
      - 'handlers/train.py'
      - 'parsers/train.py'
      - 'utils/'
      - 'training/'
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

jobs:
  test-and-run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install dependencies
      run: |
        uv sync --all-extras --dev

    - name: Check code formatting with Black
      run: |
        uv run black --check main.py preprocessing/ handlers/preprocess.py parsers/preprocess.py

    - name: Lint with Flake8
      run: |
        uv run flake8 main.py preprocessing/ handlers/preprocess.py parsers/preprocess.py --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Type check with MyPy
      run: |
        uv run mypy main.py preprocessing/ handlers/preprocess.py parsers/preprocess.py

    - name: Run pipeline
      run: |
        uv run python main.py preprocess pcos-dataset_raw/PCOS_infertility.csv pcos-dataset_raw/PCOS_data_without_infertility.xlsx -o dataset/ci_test_output.csv

    - name: Clean up test output
      if: always()
      run: rm -f preprocessing/ci_test_output.csv