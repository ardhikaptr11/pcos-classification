name: Deployment Pipeline (CI/CD)

on:
  push:
    branches:
      - main
    paths:
      - 'deployment/**'
      - 'main.py'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'deployment/**'
      - 'main.py'
      - 'Dockerfile'
  workflow_dispatch:

jobs:
  check-code-quality:
    name: Lint, Format, and Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install package manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: uv sync --all-extras --dev
      
      - name: Check code formatting with Black
        run: uv run black --check main.py deployment/ 

      - name: Lint with Flake8
        run: uv run flake8 main.py deployment/ --count --select=E9,F63,F7,F82 --show-source --statistics
        
      - name: Type check with MyPy
        run: uv run mypy main.py deployment/ 

  test-deployment:
    name: Test Deployment Logic
    needs: check-code-quality 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: uv sync --all-extras --dev
      
      - name: Run Unit Tests
        run: uv run pytest tests/test_deployment.py
      
      - name: CLI Sanity Check
        run: |
          uv run python main.py deploy --help
          uv run python main.py deploy serve --help

  build-and-deploy:
    name: Build Docker & Deploy to HF Space
    needs: test-deployment 
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    
    env:
      MODEL_NAME: ${{ secrets.MODEL_NAME }}

      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_REPO_OWNER }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_USER_TOKEN }}

      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      DOCKER_HUB_REPO_NAME: ${{ secrets.DOCKER_HUB_REPO_NAME }}

      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_USERNAME: ${{ secrets.HF_USERNAME }} 
      HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}

      NEXTJS_REPO_NAME: ${{ secrets.NEXTJS_REPO_NAME }}
      NEXTJS_REPO_PAT: ${{ secrets.NEXTJS_REPO_PAT }}
      NEXTJS_GITHUB_USERNAME: ${{ secrets.NEXTJS_GITHUB_USERNAME }}
      
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install package manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: uv sync --no-dev
      
      - name: Download Best Model from DagsHub
        run: uv run python main.py deploy download-model -S dagshub
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPO_NAME }}:latest

      - name: Sync Model to Next.js Repository
        run: |
          git config --global user.email "ml-bot@github-actions.com"
          git config --global user.name "ML Automation Bot"
          
          git clone https://x-access-token:${{ secrets.NEXTJS_REPO_PAT }}@github.com/${{ secrets.NEXTJS_GITHUB_USERNAME }}/${{ secrets.NEXTJS_REPO_NAME }}.git temp-nextjs-repo
          
          cp model_artifacts/hub/model/model.xgb temp-nextjs-repo/api/model.xgb
          
          cd temp-nextjs-repo
          
          if git status --porcelain | grep -q "model.xgb"; then
            git add api/model.xgb
            git commit -m "Auto-update: Sync latest XGBoost model from ML pipeline [skip ci]"
            git push origin main
            echo "✅ Model synced successfully!"
          else
            echo "ℹ️ No changes detected. Model already up-to-date."
          fi