[project]
name = "pcos-classification-ml-system"
version = "0.1.0"
description = "PCOS Classification ML System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dagshub>=0.7.1",
    "google-api-python-client>=2.198.0",
    "mlflow==2.19.0",
    "numpy>=2.5.1",
    "openpyxl>=3.1.5",
    "optuna>=4.9.0",
    "optunahub>=0.4.0",
    "pandas>=2.2.0,<3.0.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "xgboost>=3.3.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8>=7.3.0",
    "mypy>=2.3.0",
    "pandas-stubs>=3.0.3.260530",
    "pytest>=9.1.1",
    "types-PyYAML",
    "types-seaborn"
]

[tool.black]
line-length = 88
target-version = ["py312", "py313", "py314"]

[tool.mypy]
[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "googleapiclient.*",
]
ignore_missing_imports = true