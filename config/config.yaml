data_path: dataset/pcos_data_preprocessed.csv
experiment_name: PCOS Classification

baseline:
  run_name: XGBoost_Baseline
  params:
    n_estimators: 100
    max_depth: 5
    learning_rate: 0.1
    random_state: 42

tuning:
  run_name: XGBoost_Tuning_Optuna_ROC_AUC
  optimization_target: roc_auc
  eval_metric: logloss
  seed: 42

  sampler:
    use_optunahub: true
    package: samplers/tpe_union_multivariate
    class_name: TPEUnionMultivariateSampler
    kwargs:
      n_startup_trials: 5
      seed: 42  
  
  search_space:
    n_estimators:
      type: int
      low: 50
      high: 200
    max_depth:
      type: int
      low: 3
      high: 10
    learning_rate:
      type: float
      low: 0.01
      high: 0.3
      log: true
    subsample:
      type: float
      low: 0.5
      high: 1.0
    colsample_bytree:
      type: float
      low: 0.5
      high: 1.0
    gamma:
      type: float
      low: 0.0
      high: 5.0
    min_child_weight:
      type: int
      low: 1
      high: 10
    scale_pos_weight:
      type: dynamic_scale
      low: 1.0
      multiplier: 2.0